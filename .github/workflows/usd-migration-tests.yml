name: USD migration staged tests
on:
  push:
    branches:
      - feature/usd-wallet-migration
  pull_request:
    paths:
      - '**.py'
      - 'assets/game.js'
      - 'index.html'
  workflow_dispatch:
jobs:
  usd-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farmtest
          POSTGRES_PASSWORD: farmtest
          POSTGRES_DB: farmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://farmtest:farmtest@localhost:5432/farmtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check syntax
        run: |
          python -m compileall -q .
          node --check assets/game.js
      - name: Run all Python tests
        run: python -m unittest discover -s tests -v
