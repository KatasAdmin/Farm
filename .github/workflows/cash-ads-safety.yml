name: Cash Ads and Financial Integration Safety

on:
  push:
    branches:
      - feature/monetag-cash-rewards-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-financial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farmtest
          POSTGRES_PASSWORD: farmtest
          POSTGRES_DB: farmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U farmtest -d farmtest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://farmtest:farmtest@localhost:5432/farmtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install all application and API test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile application and test files
        run: python -m compileall -q .
      - name: Run full suite including PostgreSQL concurrency and API tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ads revenue and referral regression
        run: |
          python -m unittest -v test_bot_monetag_cash_cooldown
          python -m unittest discover -s tests -p 'test_adsgram_daily.py' -v
          python -m unittest discover -s tests -p 'test_cash_ad_actual_credits.py' -v
