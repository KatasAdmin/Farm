<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Смотреть рекламу</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#101b32,#10131f);color:#f4f7ff;font:16px system-ui,-apple-system,sans-serif;padding:24px}main{max-width:460px;margin:15vh auto;padding:24px;border:1px solid #34435d;border-radius:22px;background:#ffffff0a;box-shadow:0 14px 40px #0003}h1{font-size:24px}p{line-height:1.55;color:#c6d2e7}.status{display:inline-block;padding:7px 12px;border-radius:30px;background:#394052;color:#f1d69d;font-size:13px}.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:22px 0}.shares div{padding:12px 6px;text-align:center;background:#253047;border-radius:12px;font-size:12px}.shares strong{display:block;font-size:22px;margin-bottom:4px}button{width:100%;padding:15px;background:#45536c;border:0;border-radius:12px;color:#fff;font-size:16px;cursor:not-allowed}small{display:block;color:#9eacc3;line-height:1.5;margin-top:14px}</style></head>
<body><main><h1>🎬 Смотреть рекламу</h1>
<p id="identity" role="status">Подключаем рекламу…</p>
<p id="quota" role="status"></p>
<button id="watch" disabled aria-disabled="true">Загружаем рекламу…</button>
<small>Денежные начисления и вывод пока недоступны. Просмотр учитывается только после подтверждения рекламной сети.</small></main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/cash-ads-sdk.js"></script>
<script>
(async()=>{
 const label=document.getElementById('identity');
 const app=window.Telegram?.WebApp;
 try{
  app?.ready?.();app?.expand?.();
  if(!app?.initData){label.textContent='Откройте экран внутри Telegram для проверки аккаунта.';return}
  const response=await fetch('/api/ads/cash/preview-auth',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({telegram_data:app.initData}),credentials:'same-origin'
  });
  if(!response.ok){label.textContent='Не удалось подтвердить Telegram. Откройте экран заново.';return}
  const result=await response.json();
  label.textContent=result.ok?'Подключаем рекламу…':'Проверка недоступна.';
  const quotaLabel=document.getElementById('quota');
  const quotaResponse=await fetch('/api/ads/cash/status',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({telegram_data:app.initData}),credentials:'same-origin'
  });
  if(!quotaResponse.ok){quotaLabel.textContent='Статус ограничений пока недоступен.';return}
  const quota=await quotaResponse.json();
  quotaLabel.textContent=quota.retry_after>0?'Пауза между просмотрами':'';
  const watch=document.getElementById('watch');
  if(result.enabled===true && quota.enabled===true && quota.test_mode===true){
    watch.disabled=false;
    watch.removeAttribute('aria-disabled');
    watch.style.cursor='pointer';
    watch.textContent='Смотреть рекламу';
    label.textContent='';
    quotaLabel.textContent='Загружаем рекламу…';
    const startAd=async()=>{
      watch.disabled=true;
      watch.setAttribute('aria-disabled','true');
      watch.textContent='Загрузка рекламы…';
      quotaLabel.textContent='';
      try{
        const ad=await window.FarmCashAds.showCashAd(app.initData);
        quotaLabel.textContent=ad.monetized
          ?'Оплачиваемый просмотр подтверждён рекламной сетью. Выплаты пока недоступны.'
          :'Просмотр завершён, но оплата рекламной сетью не подтверждена.';
        watch.disabled=false;
        watch.removeAttribute('aria-disabled');
        watch.textContent='Смотреть рекламу';
      }catch(error){
        const message=String(error?.message||'Не удалось показать рекламу');
        const noFill=/no.?ads|no.?fill|no.?inventory|no.?available|not.?available|no.?ad|нет доступной рекламы|реклама недоступна/i.test(message);
        if(noFill){
          watch.disabled=true;
          watch.setAttribute('aria-disabled','true');
          watch.textContent='Нет доступной рекламы';
          quotaLabel.textContent='Сейчас оплачиваемая реклама недоступна.';
        }else{
          quotaLabel.textContent=message;
          watch.disabled=false;
          watch.removeAttribute('aria-disabled');
          watch.textContent='Повторить просмотр';
        }
      }
    };
    watch.addEventListener('click',startAd);
    if(Number(quota.retry_after||0)===0 && !quota.active_attempt)startAd();
    else{
      watch.disabled=true;
      watch.textContent='Ожидаем доступность рекламы';
      quotaLabel.textContent=quota.retry_after>0
        ?'Следующий просмотр через '+Math.ceil(quota.retry_after)+' сек.'
        :'Предыдущий просмотр ещё обрабатывается.';
    }
  }
  if(!quota.enabled){label.textContent='Реклама временно недоступна';watch.textContent='Недоступно';}
  const deadline=Date.now()+Math.max(0,Number(quota.retry_after)||0)*1000;

  const render=()=>{
   const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));
   if(remaining)quotaLabel.textContent='До следующего блока рекламы: '+remaining+' сек.';
   else if(!quota.enabled)quotaLabel.textContent='Правило: 10 просмотров подряд, затем до 30 секунд отдыха. Без дневного лимита.';
  };
  render();
  if(quota.retry_after>0){const timer=setInterval(()=>{render();if(Date.now()>=deadline)clearInterval(timer)},1000)}

 }catch(e){label.textContent='Сервер проверки временно недоступен.'}
})();
</script></body></html>
