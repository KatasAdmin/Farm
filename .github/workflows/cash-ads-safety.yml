name: Cash Ads Safety Tests

on:
  push:
    branches:
      - feature/monetag-cash-rewards-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-cash-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile bot_monetag_cash.py bot_economy.py bot_adsgram_daily.py bot_cash_ad_credits.py test_bot_monetag_cash_cooldown.py tests/test_adsgram_daily.py tests/test_cash_ad_actual_credits.py
      - name: Cooldown and postback safety unit tests
        run: |
          python -m unittest -v test_bot_monetag_cash_cooldown
          python -m unittest discover -s tests -p 'test_adsgram_daily.py' -v
          python -m unittest discover -s tests -p 'test_cash_ad_actual_credits.py' -v
