<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Смотреть рекламу</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101d19;color:#effff6;font:16px system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
main{width:min(100%,430px);padding:26px 20px;background:#1c3229;border:1px solid #39584a;border-radius:22px;text-align:center}
h1{font-size:23px;margin:4px 0 10px}p{color:#c7dacd;line-height:1.5}#msg{min-height:50px}button{display:block;width:100%;margin:11px 0 0;padding:14px;background:#21935b;border:0;border-radius:12px;color:white;font-size:17px;font-weight:650;cursor:pointer}button[disabled]{opacity:.55;cursor:not-allowed}#back{background:#355344}small{display:block;margin-top:18px;color:#a8bdb0;font-size:12px;line-height:1.5}
</style></head>
<body><main>
<h1>🎬 Смотреть рекламу</h1>
<p id="msg" role="status">Открываем рекламный ролик…</p>
<button id="watch" disabled>Подключаем рекламу…</button>
<button id="back" type="button">← Вернуться в бот</button>
<small>AdsGram — единственная рекламная сеть на этой странице. Подтверждённые просмотры учитываются для суточного распределения дохода; до сверки сумма награды неизвестна.</small>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/adsgram-fallback.js?v=20261106-r38"></script>
<script>
(async()=>{
 const app=window.Telegram?.WebApp;
 const msg=document.getElementById('msg'),watch=document.getElementById('watch'),back=document.getElementById('back');
 const data=app?.initData;let busy=false,blockId='';
 function close(){if(app?.close)app.close();else msg.textContent='Вернись в чат бота.'}
 back.onclick=close;
 async function post(path,extra={}){
  const r=await fetch('/api/ads/'+path,{method:'POST',credentials:'same-origin',
   headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_data:data,...extra})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Ошибка сервера');
  return j;
 }
 async function play(){
  if(busy)return;
  busy=true;watch.disabled=true;watch.textContent='Загружаем…';msg.textContent='Открываем AdsGram…';
  let prepared;
  try{
   prepared=await post('adsgram/prepare');
   await window.FarmAdsgramFallback.show(blockId);
   msg.textContent='✅ Просмотр завершён. Подтверждение и начисление дохода обрабатываются отдельно. Можешь вернуться в бот.';
   watch.textContent='🎬 Смотреть ещё';
   watch.disabled=false;
  }catch(e){
   if(prepared?.attempt_id){
    try{await post('adsgram/cancel',{attempt_id:prepared.attempt_id})}catch(_){}
   }
   const info=String(e?.message||'AdsGram недоступен');
   msg.textContent=/previous|pending|active/i.test(info)
     ?'Предыдущий просмотр ещё обрабатывается. Попробуй через несколько минут.'
     : /did not complete/i.test(info)
     ?'Просмотр прерван. Деньги не начислены.'
     :info;
   watch.disabled=false;watch.textContent='🎬 Попробовать снова';
  }finally{busy=false}
 }
 watch.onclick=play;
 try{
  app?.ready?.();app?.expand?.();
  if(!data)throw new Error('Открой рекламу из Telegram-бота.');
  const status=await post('cash/status');
  if(!status.adsgram_enabled)throw new Error('AdsGram временно недоступен.');
  blockId=String(status.adsgram_block_id||'');
  watch.disabled=false;watch.textContent='🎬 Смотреть рекламу';
  await play();
 }catch(e){
  msg.textContent=String(e?.message||'Не удалось загрузить рекламу');
  watch.disabled=true;watch.textContent='Недоступно';
 }
})();
</script>
</body></html>
