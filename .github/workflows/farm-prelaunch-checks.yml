name: Farm prelaunch checks
on:
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/farm-prelaunch-checks.yml'
  push:
    branches:
      - farm-prelaunch-2026-11-01
jobs:
  python-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farmtest
          POSTGRES_PASSWORD: farmtest
          POSTGRES_DB: farmtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://farmtest:farmtest@localhost:5432/farmtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check assets/game.js
      - name: Install application test dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
