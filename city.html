<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071e37"><title>НОВАЯ ЖИЗНЬ — ГОРОД</title>
<link rel="stylesheet" href="/assets/city/city.css?v=4">
<script src="https://telegram.org/js/telegram-web-app.js" async onload="window.dispatchEvent(new Event('telegram-sdk-ready'))"></script>
<script src="/assets/city/city.js?v=5" defer></script>
<script src="/assets/adsgram-fallback.js?v=20261106-r38" defer></script>
<script src="/assets/city/city-ads.js?v=2" defer></script>
</head>
<body>
<div class="backdrop-glow"></div>
<div id="city-shell">
<header class="topbar">
<div class="city-identity"><div class="city-logo">🏙️</div><div><span class="brand-kicker">НОВАЯ ЖИЗНЬ</span><h1>МОЙ ГОРОД</h1></div></div>
<div class="top-counters"><div class="counter"><span>🪙</span><strong id="coins">—</strong></div><div class="counter rep"><span>⭐</span><strong id="reputation">—</strong></div><a class="farm-return" href="/" title="Вернуться на ферму">🌾 <span>Ферма</span></a></div>
</header>
<main>
<section class="map-section" aria-label="Карта города">
<div class="world-frame">
<div class="world" id="world" aria-label="Интерактивный город">
<div class="terrain terrain-a"></div><div class="terrain terrain-b"></div><div class="terrain terrain-c"></div>
<div class="river"></div><div class="river-shine"></div>
<div class="road road-x road-top"></div><div class="road road-x road-middle"></div>
<div class="road road-y road-left"></div><div class="road road-y road-right"></div>
<div class="crosswalk cross-1"></div><div class="crosswalk cross-2"></div>
<div class="mini-lake"></div>
<div class="tree t1">🌳</div><div class="tree t2">🌳</div><div class="tree t3">🌲</div><div class="tree t4">🌳</div><div class="tree t5">🌲</div><div class="tree t6">🌳</div><div class="tree t7">🌳</div><div class="tree t8">🌲</div><div class="tree t9">🌳</div><div class="tree t10">🌳</div>
<div class="bush b1">🌼</div><div class="bush b2">🌻</div><div class="bush b3">🌸</div>
<button class="building bakery-building" data-business="bakery" aria-label="Открыть пекарню"><span class="roof"></span><span class="building-face"><span class="shop-sign">🥐</span><span class="window">✦</span><span class="door"></span></span><span class="building-label">ПЕКАРНЯ</span></button>
<button class="building restaurant-building" data-business="restaurant" aria-label="Открыть ресторан"><span class="roof"></span><span class="building-face"><span class="shop-sign">🍳</span><span class="window">✦</span><span class="door"></span></span><span class="building-label">РЕСТОРАН</span></button>
<button class="building dairy-building" data-business="dairy" aria-label="Открыть молочную"><span class="roof"></span><span class="building-face"><span class="shop-sign">🥛</span><span class="window">✦</span><span class="door"></span></span><span class="building-label">МОЛОЧНАЯ</span></button>
<button class="building atelier-building" data-business="atelier" aria-label="Открыть ателье"><span class="roof"></span><span class="building-face"><span class="shop-sign">🧶</span><span class="window">✦</span><span class="door"></span></span><span class="building-label">АТЕЛЬЕ</span></button>
<div class="home home-a"><span>🏠</span></div><div class="home home-b"><span>🏡</span></div><div class="home home-c"><span>🏘️</span></div>
<div class="fountain">⛲</div><div class="car car-1">🚙</div><div class="car car-2">🚕</div>
<div class="citizen citizen-1">🚶</div><div class="citizen citizen-2">🚶‍♀️</div><div class="citizen citizen-3">🧍</div><div class="citizen citizen-4">🚶</div><div class="citizen citizen-5">🚶‍♀️</div>
</div>
</div>
</section>
<section class="dash" aria-label="Сводка города">
<div class="stat-grid">
<button class="stat" id="view-businesses"><span>Предприятия</span><strong id="business-count">—</strong></button>
<button class="stat" id="view-orders"><span>Готовые товары</span><strong id="products-count">—</strong></button>
<button class="stat" id="view-jobs"><span>В работе</span><strong id="jobs-count">—</strong></button>
<button class="stat" id="view-residents"><span>Заказы жителей</span><strong id="orders-count">—</strong></button>
</div>
<div class="quick-actions">
<button id="view-store" class="quick-action" type="button">🛒 <span>Лавка наборов</span></button>
<button id="city-watch-ad" class="quick-action" type="button" hidden>🎬 <span>Реклама · +3 🪙</span></button>
</div>
<p id="city-ad-status" class="city-ad-status" role="status" hidden></p>
</section>
</main>
<nav class="bottom-nav" aria-label="Навигация">
<button class="nav-active" data-view="map">🏙️<small>Город</small></button>
<button data-view="market">🧺<small>Рынок</small></button>
<button data-view="warehouse">📦<small>Склад</small></button>
<button data-view="residents">👥<small>Заказы</small></button>
<button data-view="profile">👤<small>Профиль</small></button>
</nav>
</div>
<div class="overlay hidden" id="panel-overlay"><div class="panel-backdrop" id="panel-backdrop"></div><aside class="city-panel" role="dialog" aria-modal="true" aria-labelledby="panel-heading"><div class="panel-grip"></div><div class="panel-top"><div><h2 id="panel-heading">Здание</h2></div><button id="close-panel" class="close-panel" type="button" aria-label="Закрыть">✕</button></div><div id="panel-body"></div></aside></div>
<div class="toast hidden" id="city-toast"></div>
<div class="auth-surface" id="city-auth"><div class="auth-box"><div class="auth-art">🏙️</div><span class="eyebrow">НОВАЯ ЖИЗНЬ</span><h2>Твой город ждёт</h2><p id="auth-status">Подключаемся к твоему аккаунту фермы…</p><button class="main-button" type="button" id="telegram-login" hidden>Продолжить через Telegram</button><form id="auth-form"><input id="auth-name" autocomplete="username" placeholder="Ник фермы" required><input id="auth-password" type="password" autocomplete="current-password" placeholder="Пароль фермы" required><button type="submit" class="main-button">Войти в город</button></form><a href="/">Вернуться на ферму</a></div></div>
</body></html>
