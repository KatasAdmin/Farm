<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#28243f"><title>НОВАЯ ЖИЗНЬ — ГОРОД</title>
<link rel="stylesheet" href="/assets/city/city.css?v=20">
<link rel="stylesheet" href="/assets/city/premium.css?v=2">
<link rel="stylesheet" href="/assets/city/twilight.css?v=4">
<script src="https://telegram.org/js/telegram-web-app.js" async onload="window.dispatchEvent(new Event('telegram-sdk-ready'))"></script>
<script src="/assets/city/city.js?v=29" defer></script>
<script src="/assets/adsgram-fallback.js?v=20261106-r38" defer></script>
<script src="/assets/city/city-ads.js?v=2" defer></script>
</head>
<body>
<div class="backdrop-glow"></div>
<div id="city-shell">
<header class="topbar">
<h1 class="city-identity"><img class="city-wordmark" src="/assets/city/twilight-wordmark.webp" alt="TREVIXO City — Новая жизнь · город" fetchpriority="high"></h1>
<div class="top-counters">
 <button class="quick-action" id="district-profile"><span id="district-avatar" class="district-avatar" aria-hidden="true"><img src="/assets/city/tab-icon-0.webp" alt=""></span><span><strong id="district-name">Кабинет</strong><small id="district-level"></small><progress id="district-xp" max="1" value="0" aria-label="Опыт аккаунта"></progress></span></button>
 <button type="button" class="counter wallet-trigger" id="open-city-wallet" aria-label="Кошелёк"><img src="/assets/redesign/coin.webp" alt=""><strong id="coins">—</strong><b aria-hidden="true">+</b></button>
 <button type="button" class="counter rep" id="view-reputation" aria-label="Репутация"><img src="/assets/city/profile-icon-5.webp" alt=""><strong id="reputation">—</strong><b aria-hidden="true">+</b></button>
 <button type="button" class="counter grain-counter" id="view-grain-market" aria-label="Зерно на складе"><img src="/assets/city/resource-1.webp" alt=""><strong id="grain-count">—</strong><b aria-hidden="true">+</b></button>
 <button type="button" class="counter notification-counter" id="view-notifications" aria-label="Уведомления"><img src="/assets/city/tab-icon-2.webp" alt=""><strong id="unread">—</strong></button>
</div>
</header>
<main><div id="city-home">
<section class="map-section" aria-label="Карта города"><div class="world-frame">
<div class="district-tools">

 <button class="quick-action district-pass" id="district-pass"><i aria-hidden="true"><img src="/assets/city/tab-icon-1.webp" alt=""></i><span class="pass-caption">Городской пропуск<span class="pass-meter" id="district-pass-progress" hidden></span></span><b aria-hidden="true">›</b></button>
</div>
<div class="world" id="world" aria-label="Интерактивный город">
<img class="district-art" src="/assets/city/twilight-map.webp" alt="" width="800" height="1421" fetchpriority="high">
<a class="district-target farm-target" href="/"><strong>Ферма</strong></a>
<button class="district-target bakery-target" data-business="bakery"><strong>Пекарня</strong><small></small></button>
<button class="district-target restaurant-target" data-business="restaurant"><strong>Ресторан</strong><small></small></button>
<button class="district-target dairy-target" data-business="dairy"><strong>Молочная</strong><small></small></button>
<button class="district-target atelier-target" data-business="atelier"><strong>Ателье</strong><small></small></button>
<button class="district-target store-target" data-business="store"><strong>Магазин</strong><small></small></button>
<button class="district-target warehouse-target" id="map-warehouse"><strong>Склад</strong></button>
<div class="map-shortcuts"><button data-city-screen="daily"><img src="/assets/city/menu-2.webp" alt=""><small>Задания</small><i id="city-task-alert" class="shortcut-alert" aria-label="Доступна награда" hidden>!</i></button><button data-city-screen="bonus"><img src="/assets/city/event-gift.webp" alt=""><small>Бонус</small></button></div>
</div>
</div>
</section>
<section class="dash" aria-label="Сводка города">
<div class="stat-grid">
<button class="stat" id="view-businesses"><i aria-hidden="true"><img src="/assets/city/tab-icon-3.webp" alt=""></i><span>Предприятия</span><strong id="business-count">—</strong></button>
<button class="stat" id="view-orders"><i aria-hidden="true"><img src="/assets/city/profile-icon-1.webp" alt=""></i><span>Готовая продукция</span><strong id="products-count">—</strong></button>
<button class="stat" id="view-residents"><i aria-hidden="true"><img src="/assets/city/tab-icon-2.webp" alt=""></i><span>Заказы жителей</span><strong id="orders-count">—</strong></button>
<button class="stat" id="view-jobs"><i aria-hidden="true"><img src="/assets/city/profile-icon-2.webp" alt=""></i><span>Выполнено заказов</span><strong id="completed-count">—</strong></button>
</div>
<div class="quick-actions">
<button id="view-store" class="quick-action" type="button"><img src="/assets/city/menu-0.webp" alt=""> <span>Лавка наборов</span></button>
<button id="view-market" class="quick-action market-quick" type="button"><img src="/assets/city/tab-icon-4.webp" alt=""> <span>Рынок города</span></button>
<button id="city-watch-ad" class="quick-action ad-quick" type="button"><img src="/assets/city/menu-1.webp" alt=""> <span>Реклама · +3</span></button>
</div>
<button class="season-banner" data-city-screen="season"><img class="banner-treasure" src="/assets/city/ref-chest.webp" alt=""><span>Сезон города<small>Выполняй задания, получай награды<br>и развивай свой город!</small></span><b>Подробнее ›</b></button>
<p id="city-ad-status" class="city-ad-status" role="status" hidden></p>
</section>
</div><section id="city-page" hidden aria-labelledby="page-heading"><h2 id="page-heading"></h2></section></main>
<nav class="bottom-nav" aria-label="Навигация">
<button data-view="profile"><i aria-hidden="true"><img src="/assets/city/tab-icon-0.webp" alt=""></i><small>Кабинет</small></button>
<button data-view="season"><i aria-hidden="true"><img src="/assets/city/tab-icon-1.webp" alt=""></i><small>Сезон</small></button>
<button data-view="events"><i aria-hidden="true"><img src="/assets/city/tab-icon-2.webp" alt=""></i><small>События</small></button>
<button class="nav-active" data-view="map"><i aria-hidden="true"><img src="/assets/city/tab-icon-3.webp" alt=""></i><small>Город</small></button>
<button data-view="market"><i aria-hidden="true"><img src="/assets/city/tab-icon-4.webp" alt=""></i><small>Рынок</small></button>
</nav>
</div>
<div class="overlay hidden" id="panel-overlay"><div class="panel-backdrop" id="panel-backdrop"></div><aside class="city-panel" role="dialog" aria-modal="true" aria-labelledby="panel-heading"><div class="panel-grip"></div><div class="panel-top"><div><h2 id="panel-heading">Здание</h2></div><button id="close-panel" class="close-panel" type="button" aria-label="Закрыть">✕</button></div><div id="panel-body"></div></aside></div>
<input id="city-avatar-file" type="file" accept="image/*" hidden>
<div class="toast hidden" id="city-toast"></div>
<div class="auth-surface" id="city-auth"><div class="auth-box"><div class="auth-art">🏙️</div><span class="eyebrow">НОВАЯ ЖИЗНЬ</span><h2>Твой город ждёт</h2><p id="auth-status">Подключаемся к твоему аккаунту фермы…</p><button class="main-button" type="button" id="telegram-login" hidden>Продолжить через Telegram</button><form id="auth-form"><input id="auth-name" autocomplete="username" placeholder="Ник фермы" required><input id="auth-password" type="password" autocomplete="current-password" placeholder="Пароль фермы" required><button type="submit" class="main-button">Войти в город</button></form><a href="/">Вернуться на ферму</a></div></div>
</body></html>
