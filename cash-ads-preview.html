<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Смотреть рекламу</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101d19;color:#effff6;font:16px system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
main{width:min(100%,430px);padding:26px 20px;background:#1c3229;border:1px solid #39584a;border-radius:22px;text-align:center}
h1{font-size:23px;margin:4px 0 10px}p{color:#c7dacd;line-height:1.5}#msg{min-height:50px}button{display:block;width:100%;margin:11px 0 0;padding:14px;background:#21935b;border:0;border-radius:12px;color:white;font-size:17px;font-weight:650;cursor:pointer}button[disabled]{opacity:.55;cursor:not-allowed}#back{background:#355344}small{display:block;margin-top:18px;color:#a8bdb0;font-size:12px;line-height:1.5}
</style></head>
<body><main>
<h1>🎬 Смотреть рекламу</h1>
<p id="msg" role="status">Открываем рекламный ролик…</p>
<button id="watch" disabled>Подключаем рекламу…</button>
<button id="back" type="button">← Вернуться в бот</button>
<small>Monetag начисляет подтверждённые награды сразу. AdsGram учитывает просмотры для суточного распределения подтверждённого дохода. До сверки с сетью сумма не гарантирована.</small>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/cash-ads-sdk.js?v=20261106-r37"></script>
<script src="/assets/adsgram-fallback.js?v=20261106-r37"></script>
<script>
(async()=>{
 const app=window.Telegram?.WebApp;
 const msg=document.getElementById('msg'),watch=document.getElementById('watch'),back=document.getElementById('back');
 const close=()=>{if(app?.close)app.close();else msg.textContent='Вернись в чат с ботом.'};
 back.onclick=close;
 const data=app?.initData;
 const post=async(path,body={})=>{
  const response=await fetch('/api/ads/cash/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_data:data,...body})});
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(typeof result.detail==='string'?result.detail:'Не удалось проверить доступ');
  return result;
 };
 let busy=false,adsgramEnabled=false,adsgramBlockId='';
 const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 const isNoFill=e=>e?.code==='monetag_unavailable';
 async function tryAdsgram(){
  if(!adsgramEnabled)return false;
  msg.textContent='Загружаем рекламу AdsGram…';
  const prepared=await fetch('/api/ads/adsgram/prepare',{
   method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({telegram_data:data})
  }).then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.detail||'AdsGram временно недоступен');return j});
  try{
   await window.FarmAdsgramFallback.show(adsgramBlockId);
   msg.textContent='Просмотр AdsGram завершён. Награда будет рассчитана по подтверждённой выручке сети.';
   return true;
  }catch(e){
   try{await fetch('/api/ads/adsgram/cancel',{
    method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({telegram_data:data,attempt_id:prepared.attempt_id})
   })}catch(_){}
   throw e;
  }
 }
 async function monetagResult(ymid){
  for(let attempt=0;attempt<7;attempt++){
   const check=await post('attempt-result',{ymid});
   if(check.status!=='pending')return check.status;
   await sleep(1000);
  }
  return 'pending';
 }
 async function show(){
  if(busy)return;
  busy=true;watch.disabled=true;watch.textContent='Загружаем…';msg.textContent='Открываем рекламный ролик…';
  try{
   const result=await window.FarmCashAds.showCashAd(data);
   msg.textContent='Проверяем, оплачен ли показ Monetag…';
   const status=await monetagResult(result.ymid);
   if(status==='non_valued' && adsgramEnabled){
    try{await tryAdsgram()}catch(e){msg.textContent='Показ AdsGram не завершился. Попробуй позже.';return}
   }else if(status==='valued'){
    msg.textContent='✅ Оплаченный просмотр учтён на балансе.';
   }else if(status==='non_valued'){
    msg.textContent='Monetag не оплатил просмотр. Запасная сеть пока не активна.';
   }else{
    msg.textContent='Просмотр завершён. Monetag ещё проверяет оплату.';
   }
   watch.textContent='Готово';
   close();
  }catch(error){
   if(isNoFill(error)&&adsgramEnabled){
    try{await tryAdsgram();watch.textContent='Готово';close();return}
    catch(e){msg.textContent='Показ AdsGram не завершился. Попробуй позже.'}
   }else{
    msg.textContent=isNoFill(error)?'Сейчас нет доступной рекламы. Попробуй позже.':String(error?.message||'Реклама временно недоступна');
   }
  }finally{
   busy=false;
   if(watch.textContent!=='Готово'){
    watch.disabled=false;
    watch.textContent='🎬 Попробовать снова';
   }
  }
 }
 watch.onclick=show;
 try{
  app?.ready?.();app?.expand?.();
  if(!data){throw new Error('Открой просмотр из Telegram-бота.')}
  const status=await post('status');
  adsgramEnabled=status.adsgram_enabled===true;
  adsgramBlockId=String(status.adsgram_block_id||'');
  if(!status.enabled)throw new Error('Реклама сейчас отключена.');
  if(status.active_attempt)throw new Error('Предыдущий просмотр ещё обрабатывается. Попробуй позже.');
  if(status.retry_after>0)throw new Error('Пауза после десяти просмотров: '+Math.ceil(status.retry_after)+' секунд.');
  watch.disabled=false;watch.textContent='🎬 Смотреть рекламу';
  // Try to start immediately on entry. Some iOS/Telegram WebViews require
  // a direct gesture for ad SDK; the one fallback button remains available.
  await show();
 }catch(error){
  msg.textContent=String(error?.message||'Не удалось открыть рекламу');
  watch.disabled=true;
  watch.textContent='Недоступно';
 }
})();
</script></body></html>
